[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "owl-basic"
dynamic = ["version"]
authors = [
    { name = "Robert Smallshire", email = "rob@sixty-north.com" },
]
description = "A BBC BASIC compiler for the .NET CLR, with pluggable code-generation backends."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.md"]
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Compilers",
]
dependencies = [
    "ply>=3.11",
    "stevedore>=5",
    "click>=8.1",
    "oaknut-basic>=12.10.1",
]

[project.urls]
Repository = "https://github.com/rob-smallshire/owl-basic"
Issues = "https://github.com/rob-smallshire/owl-basic/issues"

[project.scripts]
owl-basic = "owl_basic.cli:cli"

# Code-generation backends, discovered by name via stevedore. Each is named for
# its target platform (which implies a runtime library). See owl_basic.extension.
[project.entry-points."owl_basic.backend"]
dotnet = "owl_basic.ext.backends.dotnet:Backend"

# Graph sources: views of an analysed program, rendered by the visualise
# command. Discovered by name via stevedore. See owl_basic.visualise.
[project.entry-points."owl_basic.graph_source"]
cfg = "owl_basic.ext.graph_sources.cfg:CfgSource"
blocks = "owl_basic.ext.graph_sources.blocks:BlocksSource"
callgraph = "owl_basic.ext.graph_sources.callgraph:CallGraphSource"
ast = "owl_basic.ext.graph_sources.ast:AstSource"

# Graph writers: output formats for the visualise command.
[project.entry-points."owl_basic.graph_writer"]
graphml = "owl_basic.ext.graph_writers.graphml:GraphMLWriter"
dot = "owl_basic.ext.graph_writers.dot:DotWriter"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { attr = "owl_basic.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The dotnet emitter loads this committed signature manifest at compile time;
# it must ship inside the wheel, not just the source tree.
"owl_basic.ext.backends.dotnet" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["tests"]

[dependency-groups]
test = [
    "pytest>=8",
    "approvaltests>=14",
    "pillow>=10",
]
dev = [
    "bump-my-version>=0.28",
    { include-group = "test" },
    "oaknut-disc>=12.6.1",
    "pyyaml>=6",
]

# Resolve and install exclusively from PyPI. Overrides any private default
# index (e.g. an artifactory configured globally in ~/.config/uv/uv.toml) for
# this project, so locking and syncing here only ever touch PyPI.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.bumpversion]
# Single source of truth for the version is owl_basic.__version__, which
# pyproject reads dynamically. `bump-my-version bump {patch,minor,major}`
# rewrites it, commits, and tags v{new_version}; pushing that tag triggers
# release.yml.
current_version = "0.6.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
commit = true
tag = true
message = "Bump version: {current_version} → {new_version}"
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
files = [
    { filename = "src/owl_basic/__init__.py" },
]
