name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    uses: ./.github/workflows/test.yml

  dotnet-test:
    name: OwlRuntime tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The runtime is now cross-platform net10.0 (no mono, no WinForms);
        # run the tests on all three OSes to keep it that way.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run the OwlRuntime xUnit tests
        run: dotnet test OwlRuntime/OwlRuntime.Tests/OwlRuntime.Tests.csproj -c Release
